[project]
name = "papers-cool"
version = "0.1.0"
description = "Local papers.cool clone - personal arXiv reading station"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Toby" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "selectolax>=0.3.21",
    "python-dotenv>=1.0",
    "openai>=1.55",
    "apscheduler>=3.10",
    "pypdf>=5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "click>=8.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
papers-cool = "papers_cool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papers_cool"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
